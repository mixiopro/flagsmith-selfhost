# Self-hosted Flagsmith (Spec 039) — deployed via Coolify dockercompose build pack.
#
# Routing: no host ports are published. Main is a shared host where 8000/8080/8081 are
# already allocated, so each service is only `expose`d on the internal Compose network
# and Coolify's Traefik proxy routes the public hostnames below to the container ports.
# The domains are set with explicit Traefik labels rather than SERVICE_FQDN_* magic
# variables, because editing a generated FQDN variable does not regenerate the proxy
# route and the CLI cannot set docker_compose_domains.
#
#   https://flagsmith.mixio.pro      -> frontend:8080  (UI)
#   https://api.flagsmith.mixio.pro  -> api:8000       (SDK / server-side API)
#
# Secrets are still generated and persisted by Coolify from the SERVICE_PASSWORD_* /
# SERVICE_HEX_64_* magic variables, so they are never stored in this file.
#
# Images come from public Docker Hub (flagsmith/*), NOT the gated
# docker.flagsmith.com registry.
name: flagsmith
services:
  db:
    image: postgres:15.5-alpine
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_FLAGSMITHDB}
      - POSTGRES_DB=flagsmith
    volumes:
      - flagsmith_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  api:
    image: flagsmith/flagsmith-api:latest
    command: ["migrate-and-serve"]
    environment:
      - FLAGSMITH_DOMAIN=api.flagsmith.mixio.pro
      # Public URLs used to build OAuth 2.1 metadata (CLI/MCP login) and email links.
      # FLAGSMITH_API_URL must be the root, because the API serves
      # /.well-known/oauth-authorization-server there and the CLI requires the
      # advertised issuer to equal the URL it was given. FLAGSMITH_FRONTEND_URL
      # otherwise defaults to http://localhost:8080 and breaks the authorize step.
      - FLAGSMITH_API_URL=https://api.flagsmith.mixio.pro
      - FLAGSMITH_FRONTEND_URL=https://flagsmith.mixio.pro
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_FLAGSMITHDB}@db:5432/flagsmith
      - ENV=production
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_SECRET_KEY=${SERVICE_HEX_64_FLAGSMITHDJANGO}
      - USE_POSTGRES_FOR_ANALYTICS=true
      - TASK_RUN_METHOD=SYNCHRONOUSLY
      - PROMETHEUS_ENABLED=false
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.flagsmithapi-http.rule=Host(`api.flagsmith.mixio.pro`)
      - traefik.http.routers.flagsmithapi-http.entryPoints=http
      - traefik.http.routers.flagsmithapi-http.service=flagsmithapi-svc
      - traefik.http.routers.flagsmithapi-http.middlewares=flagsmith-to-https
      - traefik.http.middlewares.flagsmith-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.flagsmith-to-https.redirectscheme.permanent=true
      - traefik.http.routers.flagsmithapi-https.rule=Host(`api.flagsmith.mixio.pro`)
      - traefik.http.routers.flagsmithapi-https.entryPoints=https
      - traefik.http.routers.flagsmithapi-https.tls=true
      - traefik.http.routers.flagsmithapi-https.tls.certresolver=letsencrypt
      - traefik.http.routers.flagsmithapi-https.service=flagsmithapi-svc
      - traefik.http.services.flagsmithapi-svc.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: flagsmith/flagsmith-frontend:latest
    environment:
      - FLAGSMITH_API_URL=https://api.flagsmith.mixio.pro/api/v1/
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.flagsmithui-http.rule=Host(`flagsmith.mixio.pro`)
      - traefik.http.routers.flagsmithui-http.entryPoints=http
      - traefik.http.routers.flagsmithui-http.service=flagsmithui-svc
      - traefik.http.routers.flagsmithui-http.middlewares=flagsmith-to-https
      - traefik.http.middlewares.flagsmith-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.flagsmith-to-https.redirectscheme.permanent=true
      - traefik.http.routers.flagsmithui-https.rule=Host(`flagsmith.mixio.pro`)
      - traefik.http.routers.flagsmithui-https.entryPoints=https
      - traefik.http.routers.flagsmithui-https.tls=true
      - traefik.http.routers.flagsmithui-https.tls.certresolver=letsencrypt
      - traefik.http.routers.flagsmithui-https.service=flagsmithui-svc
      - traefik.http.services.flagsmithui-svc.loadbalancer.server.port=8080
    depends_on:
      - api
volumes:
  # v2: the original volume was initialized before the magic variables existed, and
  # PostgreSQL keeps the password set at initdb time for the life of the data
  # directory, so a fresh volume is required for the generated password to apply.
  flagsmith_pgdata_v2:
